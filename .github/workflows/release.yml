# A release for a tag `v<version>` (the version every package has): checked as a push is, each
# package published to GitHub's npm registry (npm.pkg.github.com, under @overweave), then a release on
# GitHub with each package's tarball (`npm pack`) attached. Nothing goes to npmjs.com. A 0.x version
# is released as a pre-release; a version with a `-` is published under the `next` tag, not `latest`.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@overweave'
      - run: npm ci --no-audit --no-fund
      - name: The tag is every package's version
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"
      - run: npm run build
      - run: npm run pack
      - name: The packages, in GitHub's registry
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          tag="latest"
          case "$GITHUB_REF_NAME" in *-*) tag="next" ;; esac
          npm publish --workspaces --tag "$tag"
      - name: The release, its packages attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" packed/*.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $pre
