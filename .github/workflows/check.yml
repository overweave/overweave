# On every push to main and every pull request; called by the release too:
#   check  lint and format, types, tests (their coverage shown: a warning under 80%, never a failure);
#          the packages built, imported as plain Node imports them, and packed as they would be published
#   audit  the dependencies: no known vulnerability (high or worse), every one signed by its registry
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      # Shown on the run (its summary; a warning under 80%), never failing it.
      - run: npm run coverage:summary
      - run: npm run build
      - run: npm run check:dist
      - run: npm run pack

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # What is published depends on: any known vulnerability; the tools it is built with: high or worse.
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high
      - run: npm audit signatures
